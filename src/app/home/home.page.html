<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>
      Info List 
      <span *ngIf="userRole === 'admin'" style="color: #f43f5e; font-size: 12px; font-weight: bold; border: 1px solid #f43f5e; padding: 2px 6px; border-radius: 6px; margin-left: 8px;">
        ADMIN
      </span>
    </ion-title>
    
    <ion-buttons slot="end">
      <ion-button color="danger" fill="outline" size="small" (click)="logout()" style="margin-right: 10px;">
        <ion-icon slot="start" name="log-out-outline"></ion-icon>
        Salir
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <div *ngIf="userRole === 'admin'" style="background: rgba(244, 63, 94, 0.1); border: 1px solid #f43f5e; padding: 10px; border-radius: 8px; margin-bottom: 15px; color: #fda4af; font-size: 13px;">
    🔑 Panel de Control Activo: Tienes permisos completos de administración sobre los registros.
  </div>

  <ion-list>
    <ion-item *ngFor="let item of infos">
      <ion-label>
        <h2>{{ item.info_title }}</h2>
        <p>{{ item.info_description }}</p>
      </ion-label>
      
      <!-- Solo el administrador ve Editar y Borrar -->
      <ion-button *ngIf="userRole === 'admin'" slot="end" color="primary" (click)="edit(item.id)">
        Editar
      </ion-button>
      
      <ion-button *ngIf="userRole === 'admin'" slot="end" color="danger" (click)="delete(item.id)">
        Borrar
      </ion-button>
    </ion-item>
  </ion-list>

  <!-- El botón flotante de crear aparece para todos (admins y usuarios comunes) -->
  <ion-fab vertical="bottom" horizontal="end" slot="fixed">
    <ion-fab-button routerLink="/create">
      <ion-icon name="add-outline"></ion-icon>
    </ion-fab-button>
  </ion-fab>
</ion-content>

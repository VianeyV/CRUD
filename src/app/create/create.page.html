
<ion-header class="ion-no-border">
  <ion-toolbar class="create-toolbar">
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/home"></ion-back-button>
    </ion-buttons>
    <ion-title class="create-title">Nuevo producto</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="create-content">
  <div class="form">

    <div class="form-head">
      <h2>Registrar artículo</h2>
      <p>Añade un nuevo cosmético al catálogo</p>
    </div>

    <!-- Imágenes -->
    <p class="section-label">
      Imágenes ({{ images.length }}/{{ MAX_IMAGES }})
    </p>

    <input
      #fileInput
      type="file"
      accept="image/*"
      multiple
      hidden
      (change)="onFilesSelected($event)"
    />

    <div class="thumbs">
      <div class="thumb" *ngFor="let img of images; let i = index">
        <img [src]="img" [alt]="'Imagen ' + (i + 1)" />

        <span class="cover-badge" *ngIf="i === 0">
          Portada
        </span>

        <button
          type="button"
          class="thumb-btn remove"
          (click)="removeImage(i)">
          ×
        </button>

        <button
          type="button"
          class="thumb-btn cover"
          *ngIf="i > 0"
          (click)="makeCover(i)">
          ★
        </button>
      </div>

      <button
        type="button"
        class="add-thumb"
        *ngIf="images.length < MAX_IMAGES"
        (click)="fileInput.click()">

        <span class="plus">+</span>
        <span>Añadir</span>
      </button>
    </div>

    <p class="hint">
      La primera imagen es la portada. Toca ★ para hacer portada otra imagen.
    </p>

    <p *ngIf="uploading" class="uploading">
      Procesando imágenes...
    </p>

    <!-- Datos -->
    <ion-input
      class="field"
      fill="outline"
      label="Nombre del producto"
      labelPlacement="stacked"
      placeholder="Ej. Paleta de sombras"
      [(ngModel)]="info_title">
    </ion-input>

    <ion-input
      class="field"
      fill="outline"
      type="number"
      inputmode="decimal"
      label="Precio (USD)"
      labelPlacement="stacked"
      placeholder="Ej. 29.99"
      [(ngModel)]="product_price">
    </ion-input>

    <ion-input
      class="field"
      fill="outline"
      type="number"
      inputmode="numeric"
      label="Stock disponible"
      labelPlacement="stacked"
      placeholder="Vacío = sin límite"
      [(ngModel)]="product_stock">
    </ion-input>

    <!-- Categoría -->
    <p class="section-label">Categoría</p>

    <div class="chips">
      <button
        *ngFor="let c of categories"
        type="button"
        class="chip"
        [class.active]="product_category === c"
        (click)="selectCategory(c)">
        {{ c }}
      </button>
    </div>

    <!-- Descripción -->
    <ion-textarea
      class="field"
      fill="outline"
      label="Descripción"
      labelPlacement="stacked"
      placeholder="Detalles, tonos o beneficios..."
      rows="3"
      [(ngModel)]="info_description">
    </ion-textarea>

    <!-- Publicar -->
    <ion-button
      class="submit-btn"
      expand="block"
      shape="round"
      [disabled]="saving || uploading"
      (click)="createProduct()">

      {{ saving ? 'Guardando...' : 'Publicar producto' }}
    </ion-button>

  </div>
</ion-content>

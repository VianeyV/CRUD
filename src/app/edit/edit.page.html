<ion-header [translucent]="true">
  <ion-toolbar style="--background: #0f0a1a;">
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/home" color="light"></ion-back-button>
    </ion-buttons>
    <ion-title style="color: #f3e8ff;">✨ Editar Producto</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding" style="--background: #0f0a1a;">
  
  <div style="text-align: center; margin: 20px 0;">
    <h2 style="color: #d8b4fe; font-weight: bold;">Modificar Catálogo</h2>
    <p style="color: #94a3b8; font-size: 14px;">Actualiza la información del artículo</p>
  </div>

  <ion-list lines="none" style="background: transparent;">
    
    <ion-item style="--background: rgba(30, 27, 75, 0.6); border: 1px solid rgba(168, 85, 247, 0.4); border-radius: 12px; margin-bottom: 16px;">
      <ion-input 
        label="Nombre del Producto" 
        labelPlacement="stacked" 
        [(ngModel)]="info_title"
        style="color: #fff;">
      </ion-input>
    </ion-item>

    <ion-item style="--background: rgba(30, 27, 75, 0.6); border: 1px solid rgba(168, 85, 247, 0.4); border-radius: 12px; margin-bottom: 16px;">
      <ion-input 
        type="number" 
        label="Precio ($ USD)" 
        labelPlacement="stacked" 
        [(ngModel)]="product_price"
        style="color: #fff;">
      </ion-input>
    </ion-item>

    <ion-item style="--background: rgba(30, 27, 75, 0.6); border: 1px solid rgba(168, 85, 247, 0.4); border-radius: 12px; margin-bottom: 16px;">
      <ion-input 
        label="URL de la Imagen" 
        labelPlacement="stacked" 
        [(ngModel)]="product_image"
        style="color: #fff;">
      </ion-input>
    </ion-item>

    <ion-item style="--background: rgba(30, 27, 75, 0.6); border: 1px solid rgba(168, 85, 247, 0.4); border-radius: 12px; margin-bottom: 24px;">
      <ion-textarea 
        label="Descripción" 
        labelPlacement="stacked" 
        [(ngModel)]="info_description"
        rows="3"
        style="color: #fff;">
      </ion-textarea>
    </ion-item>

  </ion-list>

  <ion-button expand="block" (click)="updateProduct()" style="--background: #a855f7; --color: #fff; font-weight: bold; height: 48px; border-radius: 12px;">
    Guardar Cambios
  </ion-button>

</ion-content>
